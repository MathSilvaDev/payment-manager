<div class="settings-page">
  <header class="page-header">
    <div>
      <span class="eyebrow">WORKSPACE / SETTINGS</span>
      <h1>Settings</h1>
      <p>Configure the values used by your payment workspace.</p>
    </div>

    <div class="header-actions">
      <a class="btn-secondary" routerLink="/payments">Payments</a>
      <a class="btn-secondary" routerLink="/contacts">Contacts</a>
    </div>
  </header>

  <section class="form-panel">
    <div class="panel-header">
      <div class="panel-icon">⚙</div>
      <div>
        <h2>Application settings</h2>
        <p>Update your starting balance for the payment system.</p>
      </div>
    </div>

    <form class="settings-form" (ngSubmit)="save()">
      <div class="form-group">
        <label for="initialAmount">Initial amount <span class="required">*</span></label>
        <input
          id="initialAmount"
          name="initialAmount"
          type="number"
          min="0"
          step="0.01"
          required
          [(ngModel)]="settings().initialAmount"
        />
        <span class="field-hint">This amount is used as the starting value for your workspace.</span>
      </div>

      <div class="form-footer">
        <a class="btn-secondary" routerLink="/payments">Cancel</a>
        <button class="btn-primary" type="submit" [disabled]="isSaving()">
          {{ isSaving() ? 'Saving...' : 'Save changes' }}
        </button>
      </div>
    </form>
  </section>

  <div class="bottom-note">PAYMENT MANAGEMENT SYSTEM <span>•</span> POWERED BY MATHEUS</div>
</div>
